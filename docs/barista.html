<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SO-ARM100 로봇팔이 정해진 프로그램으로 커피를 만드는 3D 실습실 — 한 잔씩 vs 머신이 도는 동안 다음 일, 사이클 타임 비교">
<meta property="og:type" content="website">
<meta property="og:title" content="로봇 바리스타 3D 실습실">
<meta property="og:description" content="SO-ARM100 로봇팔이 정해진 프로그램으로 커피를 만드는 3D 실습실 — 한 잔씩 vs 머신이 도는 동안 다음 일, 사이클 타임 비교">
<meta property="og:url" content="https://stanlee7.github.io/robot-arm-3d-lab/barista.html">
<meta property="og:image" content="https://stanlee7.github.io/robot-arm-3d-lab/barista.png">
<style>[hidden]{display:none!important}</style>
<title>로봇 바리스타 3D 실습실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--ground:#0f1315;--surface:#161b1e;--surface-2:#1d2327;--ink:#e6ebed;--muted:#98a4aa;--line:#293237;--accent:#ffc21a;--good:#3cc07e;--bad:#ef6a64;--brew:#c08a54;
--font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
html,body{height:100%;margin:0}body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--font)}
button,input{font:inherit;color:inherit}
.app{box-sizing:border-box;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px 16px 16px}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto;min-height:100%}}
#stage{position:relative;border-radius:14px;overflow:hidden;background:#1b2126;min-height:300px}
#view{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(14,18,21,.78);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-family:var(--mono);font-size:13px}
.chip b{color:var(--accent);font-weight:500}
aside{display:flex;flex-direction:column;gap:10px;overflow:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
h1{font-size:18px;margin:0 0 2px}h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:#182024;border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
label.sl{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin-top:6px}
input[type=range]{accent-color:var(--accent)}
.m{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--brew)}
.orders{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto}
.o{display:flex;justify-content:space-between;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.o .s{color:var(--muted)}.o.done{border-color:var(--good)}.o.done .s{color:var(--good)}
.big{font-family:var(--mono);font-size:26px;font-weight:500}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.cmp div{background:var(--surface-2);border-radius:10px;padding:8px}
.log{font-family:var(--mono);font-size:12px;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <div id="stage"><canvas id="view"></canvas><div id="loading">3D 불러오는 중…</div>
    <div class="hud"><span class="chip">로봇 시간 <b id="clock">0.0</b>초</span><span class="chip" id="phase">대기</span></div></div>
  <aside>
    <div class="card"><h1>로봇 바리스타 3D 실습실</h1>
      <div class="muted">실제 저가 로봇팔 SO-ARM100 모델이 정해진 순서(프로그램)로 커피를 만듭니다. 실행 중 AI는 쓰지 않습니다. <a href="./">← 로봇팔 실습실</a></div></div>
    <div class="card"><h2>1. 주문</h2>
      <div class="row"><button class="btn primary" id="o-a">아메리카노</button><button class="btn primary" id="o-l">라떼</button><button class="btn" id="o-3">3잔 한 번에</button></div>
      <div class="muted" style="margin-top:6px">컵 보관대 3개 · 픽업대 2칸(차면 손님이 가져감)</div></div>
    <div class="card"><h2>2. 로봇이 일하는 방식</h2>
      <div class="seg"><button id="m-seq" class="on">한 잔씩 끝까지</button><button id="m-pipe">머신 도는 동안 다음 일</button></div>
      <label class="sl">에스프레소<input type="range" id="t-e" min="2" max="30" value="10"><span id="v-e">10초</span></label>
      <label class="sl">우유<input type="range" id="t-m" min="2" max="20" value="6"><span id="v-m">6초</span></label>
      <label class="sl">재생 속도<input type="range" id="t-s" min="1" max="4" value="2"><span id="v-s">2배</span></label></div>
    <div class="card"><h2>3. 머신</h2>
      <div class="m"><span>에스프레소</span><div class="bar"><i id="b-e"></i></div></div>
      <div class="m"><span>우유</span><div class="bar"><i id="b-m"></i></div></div></div>
    <div class="card"><h2>4. 주문 현황</h2><div class="orders" id="orders"><div class="muted">주문을 넣어 보세요</div></div></div>
    <div class="card"><h2>5. 결과 비교 (3잔 기준)</h2>
      <div class="cmp"><div><div class="muted">한 잔씩</div><div class="big" id="r-seq">-</div></div><div><div class="muted">동시 진행</div><div class="big" id="r-pipe">-</div></div></div>
      <div class="muted" id="r-note" style="margin-top:6px">같은 조건으로 두 방식을 각각 「3잔 한 번에」 돌려 보세요.</div>
      <div class="row" style="margin-top:8px"><button class="btn" id="reset">처음 상태로</button></div></div>
    <div class="card"><h2>기록</h2><div class="log" id="log"></div></div>
  </aside>
</div>
